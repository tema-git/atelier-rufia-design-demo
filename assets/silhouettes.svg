      <path d="M256 149C259 198 271 277 284 345M247 217C249 287 256 366 272 440" stroke-width="1.15" opacity=".5"/>
      <path d="M239 259C234 316 230 380 237 448" stroke-width=".95" opacity=".4"/>
      <path d="M124 438C183 453 260 451 317 421" stroke-width="1.1"/>

      <!-- A double-stitched waistband and fine front darts. -->
      <path fill="var(--fabric-color,#3156de)" d="M140 89C174 96 226 96 260 89L266 119C226 129 174 129 134 119Z"/>
      <path d="M141 95C177 102 223 102 259 95M136 113C174 122 226 122 264 113" stroke-width=".85" opacity=".65"/>
      <path d="M166 127L170 175L177 129M220 129L221 165L228 128" stroke-width="1.1" opacity=".6"/>
      <path d="M143 150C137 171 133 196 131 214" stroke-width="1.2" opacity=".65"/>

      <!-- Two small horn buttons secure the wrap at the hip. -->
      <circle cx="248" cy="107" r="4.4" fill="var(--fabric-color,#3156de)" stroke-width="1.4"/>
      <circle cx="244" cy="140" r="3.5" fill="var(--fabric-color,#3156de)" stroke-width="1.3"/>
      <path d="M247 106L249 108M249 106L247 108M243 139L245 141M245 139L243 141M232 107L239 107" stroke-width=".85"/>

      <!-- Subtle overlap and side-seam shadows retain the selected fabric hue. -->
      <path d="M249 147C237 202 219 252 198 300C175 353 150 400 119 444L129 446C158 401 181 352 204 300C225 252 242 202 252 149Z" fill="currentColor" stroke="none" opacity=".075"/>
      <path d="M264 133C276 219 293 325 312 426L320 429C291 286 275 180 266 119Z" fill="currentColor" stroke="none" opacity=".055"/>
    </g>
  </symbol>
</svg>
