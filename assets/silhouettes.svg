      <path d="M118 88C124 111 126 137 121 164C116 190 117 217 122 246M282 88C276 111 274 137 279 164C284 190 283 217 278 246"/>
      <path d="M113 164C104 218 92 279 79 346M287 164C296 218 308 279 321 346" stroke-width="1.15" opacity=".55"/>
      <path d="M84 231L101 238M316 231L299 238" stroke-width="1.1" opacity=".55"/>
      <path d="M60 338L94 350M306 350L340 338" stroke-width="1.25"/>
      <path d="M83 327L89 329M81 335L87 337M317 327L311 329M319 335L313 337" stroke-width="1.6"/>

      <!-- Contoured front darts and a welt breast pocket. -->
      <path d="M146 191C154 225 157 247 155 279M254 191C246 225 243 247 245 279" stroke-width="1.2" opacity=".75"/>
      <path d="M159 308C158 343 157 380 153 406M241 308C242 343 243 380 247 406" stroke-width="1.2" opacity=".65"/>
      <path d="M231 205L261 201L262 209L232 213Z" fill="var(--fabric-color,#3156de)" stroke-width="1.3"/>
      <path d="M234 209L258 206" stroke-width=".8" opacity=".5"/>

      <!-- Angled flap pockets, with the pocket mouth visible below each flap. -->
      <path d="M137 285L179 289L178 303L136 299Z" fill="var(--fabric-color,#3156de)" stroke-width="1.55"/>
      <path d="M221 289L263 285L264 299L222 303Z" fill="var(--fabric-color,#3156de)" stroke-width="1.55"/>
      <path d="M140 303L174 306M226 306L260 303" stroke-width="1" opacity=".55"/>
      <path d="M140 289L175 292M225 292L260 289" stroke-width=".8" opacity=".55"/>

      <!-- Two horn buttons and discreet stitched buttonholes. -->
      <path d="M200 244L200 404M195 256L186 256M195 294L186 294" stroke-width="1.3"/>
      <circle cx="206" cy="256" r="4.2" fill="var(--fabric-color,#3156de)" stroke-width="1.4"/>
      <circle cx="206" cy="294" r="4.2" fill="var(--fabric-color,#3156de)" stroke-width="1.4"/>
      <path d="M205 255L207 257M207 255L205 257M205 293L207 295M207 293L205 295" stroke-width=".75"/>

      <!-- Rounded front quarters, hem allowance, and quiet seam shadows. -->
      <path d="M200 338C197 374 193 397 186 413C165 411 143 402 128 390M200 338C203 374 207 397 214 413C235 411 257 402 272 390" stroke-width="1.05" opacity=".65"/>
      <path d="M185 133L200 244L193 227L179 149ZM215 133L200 244L207 227L221 149Z" fill="currentColor" stroke="none" opacity=".08"/>
      <path d="M124 251L131 278L130 390L123 393ZM276 251L269 278L270 390L277 393Z" fill="currentColor" stroke="none" opacity=".055"/>
    </g>
  </symbol>
  <symbol id="skirt" viewBox="0 0 400 520">
    <g fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
      <!-- A high-waisted wrap midi skirt with a shaped waistband and soft drape. -->
      <path fill="var(--fabric-color,#3156de)" d="M140 89C174 96 226 96 260 89L266 119C275 180 291 286 320 429C287 449 246 460 200 460C154 460 113 449 80 429C109 286 125 180 134 119Z"/>

