      <path fill="var(--fabric-color,#3156de)" d="M169 65C179 72 190 76 200 76C210 76 221 72 231 65L257 79L282 88C298 94 304 107 308 130L342 349L309 360L278 246L277 393C258 411 233 420 214 421L200 404L186 421C167 420 142 411 123 393L122 246L91 360L58 349L92 130C96 107 102 94 118 88L143 79Z"/>

      <!-- The facing forms a clean opening behind the two notched lapels. -->
      <path d="M169 65L200 104L231 65L221 130L200 244L179 130Z" fill="var(--lining-color,#f6f1e8)"/>
      <path d="M169 65L200 104L185 133L157 101Z" fill="var(--fabric-color,#3156de)"/>
      <path d="M231 65L200 104L215 133L243 101Z" fill="var(--fabric-color,#3156de)"/>
      <path d="M157 101L185 133L200 244L145 181L151 151L132 139Z" fill="var(--fabric-color,#3156de)"/>
      <path d="M243 101L215 133L200 244L255 181L249 151L268 139Z" fill="var(--fabric-color,#3156de)"/>
      <path d="M170 72L194 104L184 125M230 72L206 104L216 125M154 109L139 138L158 148L152 179L193 227M246 109L261 138L242 148L248 179L207 227" stroke-width=".95" opacity=".6"/>

