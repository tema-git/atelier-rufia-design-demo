      <path fill="var(--fabric-color,#3156de)" d="M171 59C177 78 187 91 200 95C213 91 223 78 229 59L251 66C266 71 277 87 282 108L299 151L270 165L248 128L239 205L242 225C251 281 271 351 299 452C277 463 243 470 200 471C157 470 123 463 101 452C129 351 149 281 158 225L161 205L152 128L130 165L101 151L118 108C123 87 134 71 149 66Z"/>

      <!-- Sleeve caps, cuffs, and the fine gathers at each shoulder. -->
      <path d="M149 66C139 86 140 108 152 128M251 66C261 86 260 108 248 128"/>
      <path d="M104 144L133 158M267 158L296 144" stroke-width="1.35"/>
      <path d="M127 104L119 130M133 85L127 107M142 75L138 92M273 104L281 130M267 85L273 107M258 75L262 92" stroke-width="1.1" opacity=".55"/>
      <path d="M117 147L122 140M127 152L133 140M283 147L278 140M273 152L267 140" stroke-width="1.1" opacity=".65"/>

      <!-- A bound neckline and shaped bodice with precise waist darts. -->
      <path d="M167 61C175 84 186 98 200 102C214 98 225 84 233 61" stroke-width="1.2"/>
      <path d="M152 128L176 147M248 128L224 147" stroke-width="1.35"/>
      <path d="M175 151L181 205L188 205ZM225 151L219 205L212 205Z" stroke-width="1.1" opacity=".7"/>
      <path d="M161 205C184 211 216 211 239 205M158 220C182 226 218 226 242 220"/>
      <path d="M162 209C185 215 215 215 238 209M160 216C183 222 217 222 240 216" stroke-width=".8" opacity=".55"/>

      <!-- Long, slightly irregular folds keep the skirt soft and dimensional. -->
      <path d="M174 224C164 283 148 364 139 458M188 226C183 299 178 380 181 466M212 226C217 299 222 380 219 466M226 224C236 283 252 364 261 458" stroke-width="1.3" opacity=".75"/>
      <path d="M160 244C156 305 130 391 118 446M240 244C244 305 270 391 282 446" stroke-width="1" opacity=".4"/>
      <path d="M177 227C170 306 157 393 155 461M223 227C230 306 243 393 245 461" stroke-width=".8" opacity=".35"/>
      <path d="M104 444C132 455 162 462 200 463C238 462 268 455 296 444" stroke-width="1.15"/>

      <!-- Narrow fabric shadows are translucent so every swatch stays coherent. -->
      <path d="M174 224C164 283 148 364 139 458L147 460C152 368 168 284 180 225ZM226 224C236 283 252 364 261 458L253 460C248 368 232 284 220 225Z" fill="currentColor" stroke="none" opacity=".075"/>
      <path d="M149 68C143 88 144 111 151 124L144 113C139 94 140 79 145 68ZM251 68C257 88 256 111 249 124L256 113C261 94 260 79 255 68Z" fill="currentColor" stroke="none" opacity=".08"/>
