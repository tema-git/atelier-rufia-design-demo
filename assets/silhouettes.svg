      <path d="M83 421C119 442 156 451 200 452C244 451 281 442 317 421" stroke-width="1.15"/>

      <!-- An asymmetrical front panel falls from the right hip to the left hem. -->
      <path fill="var(--fabric-color,#3156de)" d="M140 120C172 127 220 127 260 118C269 166 281 240 297 327L320 429C275 452 214 461 152 452L119 444C151 396 176 346 198 294C223 236 245 176 249 125"/>
